# The desktop app is the root package: `cargo test`/`clippy` here cover every crate.
[workspace]
members = ["core", "tui"]
default-members = [".", "core", "tui"]

[package]
name = "ghreviewer"
# `tauri dev` runs a bare `cargo run`, and the workspace also has the TUI's binary.
default-run = "ghreviewer"
version = "0.1.0"
description = "Local GitHub PR reviewer"
authors = ["johnoppenheimer"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ghreviewer_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt"] }
ghreviewer-core = { path = "core" }
anyhow = "1.0.104"
percent-encoding = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
