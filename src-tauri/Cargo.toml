[package]
name = "ghreviewer"
version = "0.1.0"
description = "Local GitHub PR reviewer"
authors = ["johnoppenheimer"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ghreviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["process", "time", "sync", "macros", "rt", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "gzip",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = "1.2.1"
toml_edit = "0.25.19"
notify = "8.2.2"
dirs = "7.0.0"
anyhow = "1.0.104"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
