name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # The app is macOS arm64 only.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: mise run install
      - run: mise run dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Attach the dmg and the updater files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          macos=src-tauri/target/release/bundle/macos
          # The app checks this file (see plugins.updater in tauri.conf.json).
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "$(gh release view "$TAG" --json body -q .body)" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$macos/ghreviewer.app.tar.gz.sig")" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/ghreviewer.app.tar.gz" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > latest.json
          gh release upload "$TAG" src-tauri/target/release/bundle/dmg/*.dmg "$macos/ghreviewer.app.tar.gz" latest.json
